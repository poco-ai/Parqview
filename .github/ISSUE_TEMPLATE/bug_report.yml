name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please remove sensitive data before attaching files or screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Parqview version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: parquet
    attributes:
      label: Parquet details
      description: Compression, approximate size, schema, and whether a generated sample can reproduce it.
