[package]
name = "parqview"
version = "0.1.0"
description = "A local, cross-platform Parquet data viewer"
authors = ["Parqview contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "parqview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
